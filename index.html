<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find a tone one of you hears and the other doesn’t. Try the two-minute Couples Alarm compatibility preview.">
  <meta name="theme-color" content="#071018">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Couples Alarm — Wake up. Let them sleep.">
  <meta property="og:description" content="Find a tone one of you hears and the other doesn’t. Try the two-minute Couples Alarm compatibility preview.">
  <meta property="og:url" content="https://couplesalarm.com/">
  <meta property="og:image" content="https://couplesalarm.com/assets/couples-alarm-preview-poster.jpg?v=20260730-social-launch">
  <link rel="canonical" href="https://couplesalarm.com/">
  <link rel="icon" href="assets/app-icon.png" type="image/png">
  <title>Couples Alarm — Wake up. Let them sleep.</title>
  <link rel="stylesheet" href="landing.css?v=20260731-reachable-2">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Couples Alarm home">
        <img src="assets/app-icon.png" alt="" width="42" height="42">
        <span>Couples Alarm</span>
      </a>

      <nav aria-label="Primary navigation">
        <a href="support/">Support</a>
        <a href="privacy/">Privacy</a>
      </nav>
    </header>

    <main id="content" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Wake up.<br><span>Let them sleep.</span></h1>
          <p class="hero-lede">Find a tone one of you hears and the other doesn’t.</p>

          <p class="store-state">Coming soon to the App Store</p>
        </div>

        <figure class="product-preview">
          <video id="product-preview" preload="metadata" poster="assets/couples-alarm-preview-poster.jpg?v=20260730-social-launch" aria-label="Play the Couples Alarm story">
            <source src="assets/couples-alarm-preview.mp4?v=20260730-social-launch" type="video/mp4">
            Your browser does not support embedded video.
          </video>
          <button class="video-play-button" type="button" aria-label="Play the Couples Alarm video" aria-controls="product-preview">
            <img src="assets/play-fill.svg" alt="">
          </button>
          <figcaption class="video-badge">Watch how it works · 28s</figcaption>
        </figure>

        <a class="compatibility-card" href="compatibility/" aria-label="Start the two-minute Couples Alarm compatibility test">
          <picture class="compatibility-art">
            <img src="assets/compatibility-test-couple.png?v=20260730" alt="A couple trying the Couples Alarm compatibility test together on a laptop">
          </picture>
          <span class="compatibility-heading">
            <span class="compatibility-eyebrow" aria-hidden="true"><i></i>Try it now<i></i></span>
            <strong>Can one of you hear <em>what the other can’t?</em></strong>
          </span>
          <span class="card-phone" aria-hidden="true">
            <picture>
              <img src="assets/setup-together.png?v=20260730" alt="">
            </picture>
          </span>
          <span class="compatibility-cta">
            <span>Start the 2-minute test</span>
            <img src="assets/play-fill.svg" alt="">
          </span>
        </a>
      </section>
    </main>

  </div>

  <script>
    const video = document.querySelector("#product-preview");
    const playButton = document.querySelector(".video-play-button");
    const showPosterState = () => {
      video.controls = false;
      playButton.hidden = false;
    };

    const isMobile = window.matchMedia(
      "(max-width: 720px), (orientation: landscape) and (max-width: 960px) and (max-height: 520px)",
    );
    const playVideo = () => {
      if (isMobile.matches && typeof video.webkitEnterFullscreen === "function") {
        video.webkitEnterFullscreen();
      } else if (isMobile.matches && video.requestFullscreen) {
        video.requestFullscreen().catch(() => {});
      }
      video.play().catch(showPosterState);
    };
    playButton.onclick = playVideo;
    video.onclick = () => {
      if (video.paused) playVideo();
    };
    video.onplaying = () => {
      video.controls = true;
      playButton.hidden = true;
    };
    video.onended = showPosterState;
    showPosterState();
  </script>
</body>
</html>
