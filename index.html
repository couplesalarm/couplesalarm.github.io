<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Couples Alarm helps partners find and confirm an alarm tone together before bedtime.">
  <meta name="theme-color" content="#071018">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Couples Alarm — Different ears. One alarm.">
  <meta property="og:description" content="You may hear the same alarm differently. Find and confirm a tone together before bedtime.">
  <meta property="og:url" content="https://couplesalarm.com/">
  <meta property="og:image" content="https://couplesalarm.com/assets/couples-alarm-preview-poster.jpg?v=20260730-social-launch">
  <link rel="canonical" href="https://couplesalarm.com/">
  <link rel="icon" href="assets/app-icon.png" type="image/png">
  <title>Couples Alarm — Different ears. One alarm.</title>
  <link rel="stylesheet" href="landing.css?v=20260730-7">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Couples Alarm home">
        <img src="assets/app-icon.png" alt="" width="42" height="42">
        <span>Couples Alarm</span>
      </a>

      <nav aria-label="Primary navigation">
        <a href="support/">Support</a>
        <a href="privacy/">Privacy</a>
      </nav>
    </header>

    <main id="content" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">For couples with different wake-up times</p>
          <h1 id="hero-title">Different ears.<br><span>One alarm.</span></h1>
          <p class="hero-lede">You may hear the same alarm differently. Find and confirm a tone together before bedtime.</p>

          <button class="store-state" type="button" disabled aria-label="Couples Alarm is coming soon to the App Store">Coming Soon</button>
        </div>

        <figure class="product-preview">
          <video id="product-preview" controls preload="metadata" poster="assets/couples-alarm-preview-poster.jpg?v=20260730-social-launch" aria-label="Play the Couples Alarm story">
            <source src="assets/couples-alarm-preview.mp4?v=20260730-social-launch" type="video/mp4">
            Your browser does not support embedded video.
          </video>
          <button class="video-play-button" type="button" aria-label="Play the Couples Alarm video" aria-controls="product-preview">
            <img src="assets/play-fill.svg" alt="">
          </button>
        </figure>

        <figure class="app-showcase">
          <div class="showcase-phone">
            <img src="assets/setup-together.png?v=20260730" alt="A couple setting up Couples Alarm together">
          </div>
        </figure>
      </section>
    </main>

  </div>

  <script>
    const video = document.querySelector("#product-preview");
    const playButton = document.querySelector(".video-play-button");
    const syncPlayButton = () => {
      playButton.hidden = !video.paused;
    };

    playButton.onclick = () => video.play().catch(syncPlayButton);
    video.onplay = syncPlayButton;
    video.onpause = syncPlayButton;
    video.onended = syncPlayButton;
  </script>
</body>
</html>
