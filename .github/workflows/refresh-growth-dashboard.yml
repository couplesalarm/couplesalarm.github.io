name: Refresh growth dashboard

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: growth-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check reporting configuration
        id: config
        env:
          ASC_KEY_ID: ${{ secrets.ASC_REPORTS_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_REPORTS_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_REPORTS_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
        run: |
          if [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" && -n "$ASC_VENDOR_NUMBER" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple reporting secrets are not configured; keeping the last dashboard snapshot."
          fi
      - name: Publish latest Apple snapshot
        if: steps.config.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_REPORTS_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_REPORTS_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_REPORTS_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
        run: node scripts/refresh-growth-dashboard.mjs
      - name: Commit changed snapshot
        id: update
        if: steps.config.outputs.ready == 'true'
        run: |
          if git diff --quiet -- growth-dashboard/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-dashboard/data.json
          git commit -m "Refresh growth dashboard data"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages build
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
